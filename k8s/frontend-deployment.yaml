apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ukantjadia/devops-qr-code-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: API_BASE_URL
          value: "http://api-service.default.svc.cluster.local"