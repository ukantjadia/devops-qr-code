name: CI/CD Pipeline

on:
  push:
    branches:
      - Main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Build and push Docker image for API
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata (labels, tags, etc.) for Docker
      id: meta
      uses: docker/metadata-action@v3
      with:
        images: ukantjadia/devops-qr-code-api

    - name: Build and push Docker image for API
      uses: docker/build-push-action@v2
      with:
        context: api
        file: api/Dockerfile
        push: true
        tags: ukantjadia/devops-qr-code-api

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Install dependencies for Front-end
      run: |
        cd front-end-nextjs
        npm install

    - name: Build and push Docker image for Front-end
      run: |
        cd front-end-nextjs
        docker build -t ukantjadia/devops-qr-code-frontend .
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
        docker push ukantjadia/devops-qr-code-frontend

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: linktoqrimage
        slot-name: production
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        images: |
          ukantjadia/devops-qr-code-api
          ukantjadia/devops-qr-code-frontend
