name: CI/CD Pipeline

on:
  push:
    branches:
      - Main
    # paths:
    #   - 'api/**'
    #   - 'front-end-nextjs/**'
  pull_request:
    branches:
      - Main
    # paths:
    #   - 'api/**'
    #   - 'front-end-nextjs/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata (labels, tags, etc.) for Docker
      id: meta
      uses: docker/metadata-action@v3
      with:
        images: |
          ukantjadia/devops-qr-code-api
          ukantjadia/devops-qr-code-frontend

    - name: Build and push Docker image for API
      if: github.event_name == 'push' || github.event_name == 'pull_request'
      uses: docker/build-push-action@v2
      with:
        context: api
        file: api/Dockerfile
        push: true
        tags: |
          ukantjadia/devops-qr-code-api:latest
          ukantjadia/devops-qr-code-api:${{ github.sha }}

    - name: Build and push Docker image for Front-end
      if: github.event_name == 'push' || github.event_name == 'pull_request'
      run: |
        cd front-end-nextjs
        docker build -t ukantjadia/devops-qr-code-frontend:latest -t ukantjadia/devops-qr-code-frontend:${{ github.sha }} .
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
        docker push ukantjadia/devops-qr-code-frontend:latest
        docker push ukantjadia/devops-qr-code-frontend:${{ github.sha }}


    - name: Set up kubectl
      uses: azure/setup-kubectl@v1
      with:
        version: 'latest'

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Get AKS credentials
      run: az aks get-credentials --resource-group devopsProject1 --name ask-devops-project

    - name: Deploy to AKS
      run: |
        kubectl apply -f k8s/api-deployment.yaml
        kubectl apply -f k8s/api-service.yaml
        kubectl apply -f k8s/frontend-deployment.yaml
        kubectl apply -f k8s/frontend-service.yaml
