name: CI/CD Pipeline

on:
  push:
    branches:
      - Main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:19.03.12
        options: --privileged

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: Install dependencies for API
      run: |
        cd api
        python -m venv .venv
        . .venv/bin/activate
        pip install -r requirements.txt

    - name: Build and push Docker image for API
      run: |
        docker build -t ukantjadia/devopsqrcodeapi -f ~/api/Dockerfile .
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
        docker push ukantjadia/devops-qr-code-api

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Install dependencies for Front-end
      run: |
        cd front-end-nextjs
        npm install

    - name: Build and push Docker image for Front-end
      run: |
        cd front-end-nextjs
        docker build -t ukantjadia/devops-qr-code-frontend .
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
        docker push ukantjadia/devops-qr-code-frontend

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: your-app-name
        slot-name: production
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        images: |
          ukantjadia/devops-qr-code-api
          ukantjadia/devops-qr-code-frontend
